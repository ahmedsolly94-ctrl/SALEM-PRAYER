name: Unpack Salem Prayer

on:
  workflow_dispatch:
  push:
    paths:
      - 'SalemPrayer-v4.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          mkdir -p /tmp/salem
          unzip -q SalemPrayer-v4.zip -d /tmp/salem
          cp -r /tmp/salem/. .
          rm -f SalemPrayer-v4.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Gradle Wrapper
        working-directory: SalemPrayer
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add Salem Prayer Android project and Gradle wrapper" || echo "No changes to commit"
          git push
