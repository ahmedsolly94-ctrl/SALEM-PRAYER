workflows:
  salem-prayer-android:
    name: Salem Prayer Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Build Android APK
        working_directory: SalemPrayer
        script: |
          gradle --no-daemon assembleDebug

    artifacts:
      - SalemPrayer/app/build/outputs/apk/debug/app-debug.apk
